name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  managed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      - run: dotnet test -c Release
      - run: dotnet pack src/PictureSharp.Heif -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
  oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y cmake nasm libpng-dev libjpeg-dev pkg-config
      - run: scripts/fetch-heif-reference.sh --approved
      - run: scripts/build-heif-reference.sh
      - run: dotnet test -c Release --treenode-filter '/*/*/*/*[Category=Oracle]'
        env:
          PICTURESHARP_HEIF_TOOLS: ${{ github.workspace }}/reference/tools
          PICTURESHARP_HEIF_REQUIRE_ORACLES: '1'
